<style>
  .quiz-section{max-width:720px;margin:0 auto;padding:20px 0}
  .step-indicator{display:flex;gap:6px;justify-content:center;margin-bottom:28px}
  .step-dot{width:10px;height:10px;border-radius:50%;background:var(--line);transition:.3s}
  .step-dot.active{background:var(--brand);transform:scale(1.3)}
  .step-dot.done{background:var(--leaf)}
  .step-dot.skipped{background:var(--ink-faint)}

  .q-card{display:none;background:var(--paper);border:1px solid var(--line);border-radius:16px;
    padding:28px 26px;box-shadow:var(--shadow);animation:fadeIn .35s ease}
  .q-card.active{display:block}
  @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  
  .q-num{font-size:12px;font-weight:700;color:var(--brand);letter-spacing:.1em;margin-bottom:4px}
  .q-title{font-size:18px;font-weight:700;margin-bottom:18px;line-height:1.4}
  .q-sub{font-size:13px;color:var(--ink-faint);margin-bottom:16px}

  .options{display:flex;flex-direction:column;gap:8px}
  .opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--line);
    border-radius:12px;cursor:pointer;transition:.18s;background:var(--paper);user-select:none}
  .opt:hover{border-color:var(--brand);background:var(--brand-soft)}
  .opt.selected{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(200,83,58,.1)}
  .opt .check{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);
    display:grid;place-items:center;flex:0 0 auto;transition:.18s}
  .opt.selected .check{border-color:var(--brand);background:var(--brand)}
  .opt.selected .check::after{content:"";width:8px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg);margin-top:-2px}
  .opt .label{font-size:15px;font-weight:500;flex:1}
  .opt .desc{font-size:12.5px;color:var(--ink-faint);margin-top:1px}

  .opt.multi .check{border-radius:4px;width:20px;height:20px}
  .opt.multi.selected .check::after{width:9px;height:5px}
  .opt.multi.selected .check{border-color:var(--brand);background:var(--brand)}

  .q-actions{display:flex;justify-content:space-between;align-items:center;margin-top:22px}
  .q-actions .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;border-radius:9px;
    font-size:14px;font-weight:600;border:none;cursor:pointer;transition:.15s}
  .q-actions .btn-primary{background:var(--brand);color:#fff}
  .q-actions .btn-primary:hover{background:var(--brand-deep);transform:translateY(-1px)}
  .q-actions .btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .q-actions .btn-ghost{background:transparent;color:var(--ink-soft)}
  .q-actions .btn-ghost:hover{background:var(--line)}
  .q-actions .count{font-size:13px;color:var(--ink-faint)}

  /* 结果页 */
  .result-card{max-width:580px;margin:0 auto;text-align:center}
  .result-card .badge{width:100px;height:100px;border-radius:30px;display:grid;place-items:center;
    font-size:42px;margin:0 auto 16px}
  .result-card h3{font-size:24px;margin:0 0 6px}
  .result-card .subtitle{font-size:15px;color:var(--ink-soft);margin-bottom:16px}
  .result-card .desc{text-align:left;font-size:14px;color:var(--ink-soft);line-height:1.8;

  .result-card .traits{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}

  .result-card .share-area button{display:inline-flex;align-items:center;gap:6px;padding:11px 22px;

  .result-card .share-area .btn-share{background:var(--brand);color:#fff}
  .result-card .share-area .btn-share:hover{background:var(--brand-deep)}
  .result-card .share-area .btn-restart{background:var(--line);color:var(--ink-soft)}

  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--ink);

  .result-card .result-actions{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
  .result-card .result-actions p{font-size:13px;color:var(--ink-faint);margin-bottom:10px}
  .result-card .result-actions .btn-group{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .result-card .result-actions .btn-group a{display:inline-flex;align-items:center;gap:4px;padding:8px 14px;

    font-size:11px;color:var(--ink-faint);background:var(--paper);padding:2px 8px;border-radius:5px}

    .q-card{padding:20px 16px}
    .q-title{font-size:16px}

</style>

// ===== 结果库（对应项目画像） =====

// ===== 评分逻辑 =====
function calcResult(answers) {
  // 统计各维度得分
  let scores = {
    time_fragment: 0,
    location_keeper: 0,
    point_hunter: 0,
    social_connector: 0,
    zen_doer: 0
  };

  // scene: 碎片场景越多 → time_fragment
  if (answers.scene) {
    const selected = Array.isArray(answers.scene) ? answers.scene : [answers.scene];
    if (selected.length >= 3) scores.time_fragment += 2;
    else if (selected.length >= 1) scores.time_fragment += 1;
    if (selected.includes('commute')) scores.time_fragment += 1;
    if (selected.includes('none')) scores.time_fragment -= 1;
  }

  // duration: 时间越短 → time_fragment / location_keeper
  if (answers.duration === '5min') { scores.time_fragment += 2; scores.location_keeper += 1; }
  else if (answers.duration === '15min') { scores.time_fragment += 1; scores.location_keeper += 1; }
  else if (answers.duration === '30min') { scores.zen_doer += 1; }
  else if (answers.duration === '1h') { scores.zen_doer += 2; }

  // type: 好事类型偏好
  if (answers.type === 'help') { scores.location_keeper += 2; scores.time_fragment += 1; }
  else if (answers.type === 'community') { scores.location_keeper += 2; scores.social_connector += 1; }
  else if (answers.type === 'donate') { scores.zen_doer += 1; scores.point_hunter += 1; }
  else if (answers.type === 'teach') { scores.social_connector += 2; scores.zen_doer += 1; }
  else if (answers.type === 'accompany') { scores.social_connector += 2; scores.zen_doer += 1; }

  // reward: 回报偏好
  if (answers.reward === 'honor') { scores.point_hunter += 2; scores.social_connector += 1; }
  else if (answers.reward === 'points') { scores.point_hunter += 3; }
  else if (answers.reward === 'social') { scores.social_connector += 3; }
  else if (answers.reward === 'cert') { scores.point_hunter += 1; scores.zen_doer += 1; }
  else if (answers.reward === 'none') { scores.zen_doer += 3; }

  // company: 社交偏好
  if (answers.company === 'alone') { scores.time_fragment += 1; scores.zen_doer += 1; }
  else if (answers.company === 'family') { scores.social_connector += 2; }
  else if (answers.company === 'org') { scores.location_keeper += 1; scores.zen_doer += 1; }
  else if (answers.company === 'neighbor') { scores.social_connector += 2; scores.location_keeper += 1; }
  else if (answers.company === 'any') { scores.zen_doer += 1; }

  // identity: 身份
  if (answers.identity === '996') { scores.time_fragment += 2; scores.point_hunter += 1; }
  else if (answers.identity === 'freelance') { scores.time_fragment += 1; scores.location_keeper += 1; }
  else if (answers.identity === 'student') { scores.time_fragment += 1; scores.point_hunter += 1; }
  else if (answers.identity === 'parent') { scores.time_fragment += 1; scores.location_keeper += 1; }
  else if (answers.identity === 'retired') { scores.zen_doer += 2; scores.social_connector += 1; }

  // 取最高分
  let maxKey = 'time_fragment';
  let maxVal = 0;
  for (const [k, v] of Object.entries(scores)) {
    if (v > maxVal) { maxVal = v; maxKey = k; }
  }
  return maxKey;
}

// ===== 渲染 =====

  renderQuestions();

        <div class="options" data-q="${qi}" data-multi="${isMulti ? '1' : '0'}">
          ${q.options.map(o => `
            <div class="opt ${isMulti ? 'multi' : ''}" data-val="${o.id}" data-q="${qi}">
              <div class="check"></div>
              <div>
                <div class="label">${o.label}</div>
                <div class="desc">${o.desc}</div>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="q-actions">
          <button class="btn btn-ghost" onclick="goPrev()" ${qi === 0 ? 'disabled style=opacity:0' : ''}>← 上一题</button>
          <span class="count" id="count_${qi}"></span>
          <button class="btn btn-primary" id="next_${qi}" onclick="goNext(${qi})" disabled>${qi === questions.length - 1 ? '查看结果' : '下一题 →'}</button>
        </div>
      </div>
    `;
  }).join('');

  // 绑定选项点击
  document.querySelectorAll('.opt').forEach(el => {
    el.addEventListener('click', () => {
      const qi = parseInt(el.dataset.q);
      const q = questions[qi];
      const val = el.dataset.val;
      const isMulti = q.multi;

      if (isMulti) {
        el.classList.toggle('selected');
        const sel = Array.from(document.querySelectorAll(`.opt[data-q="${qi}"].selected`)).map(e => e.dataset.val);
        answers[q.id] = sel;
        // 更新计数
        const countEl = document.getElementById(`count_${qi}`);
        if (countEl) countEl.textContent = `已选 ${sel.length} 项`;
        // 启用按钮（至少选1项）
        const nextBtn = document.getElementById(`next_${qi}`);
        nextBtn.disabled = sel.length === 0;
      } else {
        // 单选：取消其他选中
        document.querySelectorAll(`.opt[data-q="${qi}"]`).forEach(e => e.classList.remove('selected'));
        el.classList.add('selected');
        answers[q.id] = val;
        document.getElementById(`next_${qi}`).disabled = false;
        const countEl = document.getElementById(`count_${qi}`);
        if (countEl) countEl.textContent = '已选择';
      }
    });
  });
}

function goNext(qi) {
  if (qi < questions.length - 1) {
    showStep(qi + 1);
  } else {
    showResult();
  }
}

function goPrev() {
  if (currentStep > 0) showStep(currentStep - 1);
}

function showStep(idx) {
  currentStep = idx;
  document.querySelectorAll('.q-card').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });
  document.querySelectorAll('.step-dot').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
    if (i < idx) el.classList.add('done');
    else el.classList.remove('done');
  });
  window.scrollTo({ top: 200, behavior: 'smooth' });
}

function showResult() {
  document.getElementById('questions').style.display = 'none';
  document.getElementById('steps').style.display = 'none';
  resultEl.style.display = 'block';

  const key = calcResult(answers);
  const r = results[key];

  // 生成分享文本
  const sceneNames = {
    commute: '通勤路上', lunch: '午休空隙', queue: '排队等候',
    kid: '遛娃散步', sport: '运动健身', none: '几乎无碎片时间'
  };
  const durationNames = {
    '5min': '≤5分钟', '15min': '5-15分钟', '30min': '15-30分钟', '1h': '30分钟以上'
  };
  const typeNames = {
    help: '顺手帮邻里', community: '社区公共事务', donate: '二手漂流/捐赠',
    teach: '技能助老/教学', accompany: '陪伴/倾听'
  };
  const rewardNames = {
    honor: '社区荣誉感', points: '好心值兑换', social: '认识新朋友',
    cert: '官方认证时长', none: '不需要回报'
  };
  const companyNames = {
    alone: '自己就行', family: '带上家人朋友', org: '跟着社区组织',
    neighbor: '和附近邻居', any: '无所谓'
  };
  const identityNames = {
    '996': '996打工人', freelance: '自由职业者', student: '学生党',
    parent: '全职家长', retired: '退休人士'
  };

  const nameMap = { scene: sceneNames, duration: durationNames, type: typeNames, reward: rewardNames, company: companyNames, identity: identityNames };

  let detailLines = [];
  for (const [qid, val] of Object.entries(answers)) {
    const q = questions.find(qq => qq.id === qid);
    if (!q) continue;
    const vals = Array.isArray(val) ? val : [val];
    const names = vals.map(v => nameMap[qid]?.[v] || v).join('、');
    detailLines.push(`${q.title.replace('你','我')}：${names}`);
  }

  const shareText = `🏆 我的好事人格：${r.title}（${r.subtitle}）\n\n${detailLines.join('\n')}\n\n来测测你的好事人格 → https://wadesha.github.io/good-deeds-nearby/pages/interact.html`;

  resultEl.innerHTML = `
    <div class="result-card">
      <div class="badge" style="background:${r.bg}">${r.badge}</div>
      <h3 style="color:${r.title === '时间碎片侠' ? 'var(--brand)' : r.title === '就近守护者' ? 'var(--sky)' : r.title === '好心值猎人' ? 'var(--gold)' : r.title === '社交连接者' ? 'var(--plum)' : 'var(--leaf)'}">${r.title}</h3>
      <div class="subtitle">${r.subtitle}</div>
      <div class="traits">${r.traits.map(t => `<span>${t}</span>`).join('')}</div>
      <div class="desc">${r.desc}</div>
      <div class="share-text" onclick="copyShareText()" title="点击复制">
        📋 点击复制分享文本
        <span class="copy-hint">复制</span>
      </div>
      <div class="share-area">
        <button class="btn-share" onclick="shareResult()">📤 一键分享</button>
        <button class="btn-restart" onclick="restart()">🔄 重新测试</button>
      </div>
      <div class="result-actions">
        <p>基于你的"好事人格"，你可能对以下内容感兴趣：</p>
        <div class="btn-group">
          <a href="thesis.html" class="blue">📄 立论：时间贫困群体</a>
          <a href="mvp.html" class="green">📱 MVP：好事近产品</a>
          <a href="research.html" class="orange">📊 调研验证框架</a>
        </div>
      </div>
    </div>
  `;
  window.scrollTo({ top: 200, behavior: 'smooth' });
}

function shareResult() {
  const key = calcResult(answers);
  const r = results[key];
  const text = `我刚刚测出了我的"好事人格"：${r.title} —— ${r.subtitle}\n\n来试试你的好事人格测试 👉 https://wadesha.github.io/good-deeds-nearby/pages/interact.html`;
  if (navigator.share) {
    navigator.share({ title: '我的好事人格', text }).catch(() => {});
  } else {
    copyText(text);
  }
}

  copyText(text);

function copyText(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => showToast('✅ 已复制到剪贴板，快去分享给朋友吧！'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('✅ 已复制到剪贴板！');
  }
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

function restart() {
  currentStep = 0;
  answers = {};
  document.getElementById('questions').style.display = 'block';
  document.getElementById('steps').style.display = 'flex';
  document.getElementById('steps').innerHTML = questions.map((q, i) =>
    `<div class="step-dot ${i === 0 ? 'active' : ''}" data-idx="${i}"></div>`
  ).join('');
  resultEl.style.display = 'none';
  renderQuestions();
  window.scrollTo({ top: 200, behavior: 'smooth' });
}

init();
